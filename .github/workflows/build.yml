name: Build Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    # Use the container ONLY for Linux to get the old GLIBC compatibility
    container: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu:20.04' || null }}

    steps:
      # 1. Install tools needed inside the empty container
      - name: Install System Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y curl unzip git

      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: bun build index.ts --compile --outfile tempering-ai-windows-latest.exe

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: bun build index.ts --compile --outfile tempering-ai-macos-latest

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: bun build index.ts --compile --outfile tempering-ai-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempering-ai-${{ runner.os }}
          path: |
            tempering-ai-*