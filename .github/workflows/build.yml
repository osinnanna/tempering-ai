name: Build Binaries

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install

            - name: Build binary
              run: bun build index.ts --compile --outfile dist/tempering-ai

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: tempering-ai-${{ runner.os }}
                path: dist/tempering-ai
            